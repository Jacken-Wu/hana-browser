<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hana</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fbfbfd;
        --panel: #ffffff;
        --fg: #1d1f24;
        --muted: #6b7280;
        --line: #e5e7eb;
        --accent: #3f6fd8;
        --accent-soft: #eaf0fd;
        --ok: #17864a;
        --pending: #9a6b00;
        --bad: #b3261e;
        --warnbg: #fdf3dc;
        --warnfg: #7a5600;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16181d;
          --panel: #1c1f25;
          --fg: #e6e8ee;
          --muted: #99a1b0;
          --line: #2b2f37;
          --accent: #7fa3f0;
          --accent-soft: #20293c;
          --ok: #5dd39a;
          --pending: #e0b25c;
          --bad: #f2857c;
          --warnbg: #2e2716;
          --warnfg: #e0b25c;
        }
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      body { display: flex; flex-direction: column; }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 11px 14px 9px;
        border-bottom: 1px solid var(--line);
      }
      .brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
      .dot.ok { background: var(--ok); }
      .dot.pending { background: var(--pending); }
      .dot.bad { background: var(--bad); }
      .name { font-weight: 600; }
      .status { font-size: 11px; color: var(--muted); white-space: nowrap; }
      .actions { display: flex; gap: 6px; flex: none; }
      .ghost {
        border: 1px solid var(--line);
        background: transparent;
        color: var(--muted);
        border-radius: 7px;
        padding: 3px 9px;
        font: inherit;
        font-size: 11px;
        cursor: pointer;
      }
      .ghost:hover { color: var(--fg); border-color: var(--accent); }
      .ghost.accent { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
      .ghost.accent:hover { background: var(--accent-soft); }
      .ghost:disabled { opacity: 0.5; cursor: default; }

      .pagebar {
        padding: 7px 14px;
        font-size: 11px;
        color: var(--muted);
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .banner {
        display: none;
        align-items: center;
        gap: 8px;
        padding: 9px 14px;
        background: var(--warnbg);
        color: var(--warnfg);
        font-size: 12px;
        border-bottom: 1px solid var(--line);
      }
      .banner.show { display: flex; }
      .banner .text { flex: 1; min-width: 0; }
      .banner button {
        border: 1px solid currentColor;
        background: transparent;
        color: inherit;
        border-radius: 7px;
        padding: 2px 9px;
        font: inherit;
        font-size: 11px;
        cursor: pointer;
        flex: none;
      }

      main {
        flex: 1;
        overflow-y: auto;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .empty {
        margin: auto;
        text-align: center;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.9;
      }
      .msg { max-width: 92%; white-space: pre-wrap; word-break: break-word; }
      .msg.user {
        align-self: flex-end;
        background: var(--accent-soft);
        padding: 8px 11px;
        border-radius: 12px 12px 3px 12px;
      }
      .msg.assistant {
        align-self: flex-start;
        background: var(--panel);
        border: 1px solid var(--line);
        padding: 8px 11px;
        border-radius: 12px 12px 12px 3px;
      }
      .msg.assistant details.mood {
        margin-bottom: 6px;
        font-size: 11px;
        color: var(--muted);
      }
      .msg.assistant details.mood summary {
        cursor: pointer;
        user-select: none;
        outline: none;
      }
      .msg.assistant .mood-body {
        margin-top: 6px;
        padding-left: 8px;
        border-left: 2px solid var(--line);
        white-space: pre-wrap;
        word-break: break-word;
      }
      .msg.assistant .body { word-break: break-word; }
      .msg.assistant .body p { margin: 0 0 8px; }
      .msg.assistant .body p:last-child { margin-bottom: 0; }
      .msg.assistant .body h3,
      .msg.assistant .body h4,
      .msg.assistant .body h5,
      .msg.assistant .body h6 {
        margin: 10px 0 6px;
        font-size: 1.02em;
        line-height: 1.45;
      }
      .msg.assistant .body h3:first-child,
      .msg.assistant .body h4:first-child { margin-top: 0; }
      .msg.assistant .body ul,
      .msg.assistant .body ol { margin: 6px 0; padding-left: 20px; }
      .msg.assistant .body li { margin: 2px 0; }
      .msg.assistant .body code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.92em;
        padding: 1px 4px;
        border-radius: 4px;
        background: color-mix(in srgb, var(--fg) 8%, transparent);
      }
      .msg.assistant .body pre {
        margin: 8px 0;
        padding: 9px 11px;
        border-radius: 8px;
        background: color-mix(in srgb, var(--fg) 6%, transparent);
        overflow-x: auto;
      }
      .msg.assistant .body pre code {
        background: none;
        padding: 0;
        font-size: 0.9em;
        line-height: 1.55;
      }
      .msg.assistant .body blockquote {
        margin: 6px 0;
        padding-left: 10px;
        border-left: 2px solid var(--line);
        color: var(--muted);
      }
      .msg.assistant .body a { color: var(--accent); text-decoration: none; }
      .msg.assistant .body a:hover { text-decoration: underline; }
      .msg.assistant .body hr {
        border: none;
        border-top: 1px solid var(--line);
        margin: 10px 0;
      }
      .msg.assistant .body strong { font-weight: 650; }
      .msg.system {
        align-self: center;
        color: var(--muted);
        font-size: 11px;
      }
      .thinking { color: var(--muted); font-size: 12px; align-self: flex-start; }

      .quote {
        display: none;
        margin: 0 12px;
        padding: 8px 10px;
        border-left: 2px solid var(--accent);
        background: var(--accent-soft);
        border-radius: 0 8px 8px 0;
        font-size: 12px;
      }
      .quote.show { display: block; }
      .quote-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 4px;
        color: var(--muted);
        font-size: 11px;
      }
      .quote-head .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .quote-head button {
        border: none;
        background: transparent;
        color: var(--muted);
        font-size: 14px;
        line-height: 1;
        cursor: pointer;
        padding: 0 2px;
        flex: none;
      }
      .quote-text {
        max-height: 84px;
        overflow: hidden;
        white-space: pre-wrap;
        word-break: break-word;
      }

      footer {
        border-top: 1px solid var(--line);
        padding: 10px 12px 12px;
        display: flex;
        gap: 8px;
        align-items: flex-end;
      }
      textarea {
        flex: 1;
        resize: none;
        min-height: 34px;
        max-height: 120px;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--panel);
        color: var(--fg);
        font: inherit;
        outline: none;
      }
      textarea:focus { border-color: var(--accent); }
      #send {
        padding: 8px 14px;
        border: none;
        border-radius: 9px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      #send:disabled { opacity: 0.45; cursor: default; }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <span class="dot" id="dot"></span>
        <span class="name">Hana</span>
        <span class="status" id="status">连接中…</span>
      </div>
      <div class="actions">
        <button class="ghost accent" id="summarize" hidden title="把这个 B 站视频在本地转写并总结">AI 总结</button>
        <button class="ghost" id="newchat" title="开始一段新对话">新对话</button>
      </div>
    </header>

    <div class="pagebar" id="pagebar">未绑定页面</div>

    <div class="banner" id="banner">
      <span class="text" id="bannertext"></span>
      <button id="follow">跟随</button>
      <button id="stay">保持</button>
    </div>

    <main id="messages">
      <div class="empty">
        在这里问关于当前页面的事。<br />
        对话走独立会话，不打扰主窗口。
      </div>
    </main>

    <div class="quote" id="quote">
      <div class="quote-head">
        <span class="label" id="quotelabel">选中内容</span>
        <button id="quoteclear" title="移除引用">×</button>
      </div>
      <div class="quote-text" id="quotetext"></div>
    </div>

    <footer>
      <textarea id="input" rows="1" placeholder="问点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
      <button id="send" disabled>发送</button>
    </footer>

    <script src="hana-panel.js"></script>
  </body>
</html>
